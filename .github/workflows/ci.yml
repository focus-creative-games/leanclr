name: Shared runtime and Mono compositions

on:
  push:
    branches: [core, mono, main, master]
  pull_request:
    branches: [core, mono, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NATIVE_TARGETS: public-c public-cpp host-capabilities default-host-services host-services core-boundary foundation portable-memory integer-math bit-scan il-bounds string-allocation command-line aligned-allocation lifecycle container-allocation il-fuzz-smoke
  NATIVE_TESTS: '^(public-c|public-cpp|host-capabilities|environment-exit|default-host-services|host-services|core-boundary|layer-boundaries|foundation|portable-memory|integer-math|bit-scan|il-bounds|string-allocation|command-line|aligned-allocation|lifecycle-failure|lifecycle-before-start|container-allocation|il-fuzz-smoke)$'

jobs:
  aot-features:
    name: AOT features (${{ matrix.protocol }})
    strategy:
      fail-fast: false
      matrix:
        protocol: [result, lightweight]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: '4.0.12'
          path: .emsdk
      - name: Install pinned Wasm toolchain
        shell: pwsh
        run: |
          .emsdk/emsdk.bat install 4.0.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .emsdk/emsdk.bat activate 4.0.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native and Wasm AOT/fallback paths
        run: python scripts/test/aot-features.py --target all --emsdk .emsdk ${{ matrix.protocol == 'lightweight' && '--lightweight-returns' || '' }}
      - name: Verify debug Result and frame invariants
        run: python scripts/test/aot-features.py --target native --config Debug ${{ matrix.protocol == 'lightweight' && '--lightweight-returns' || '' }}
      - name: Verify 32-bit native context and snapshot ABI
        run: python scripts/test/aot-features.py --target native --arch Win32 ${{ matrix.protocol == 'lightweight' && '--lightweight-returns' || '' }}
      - name: Verify formal AotTests with two-entry interface caches
        run: python scripts/test/global-generics.py --interface-call-cache --interface-cache-entries 2 --target all --emsdk .emsdk ${{ matrix.protocol == 'lightweight' && '--lightweight-returns' || '' }}
      - name: Verify two-entry cache Debug and 32-bit layouts
        run: |
          python scripts/test/global-generics.py --interface-call-cache --interface-cache-entries 2 --target native --config Debug ${{ matrix.protocol == 'lightweight' && '--lightweight-returns' || '' }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test/global-generics.py --interface-call-cache --interface-cache-entries 2 --target native --arch Win32 ${{ matrix.protocol == 'lightweight' && '--lightweight-returns' || '' }}
      - name: Verify single-entry interface cache control
        run: python scripts/test/global-generics.py --interface-call-cache --output out/interface-dispatch/cached --target all --emsdk .emsdk ${{ matrix.protocol == 'lightweight' && '--lightweight-returns' || '' }}
      - name: Verify cache-disabled native and Wasm control
        run: python scripts/test/global-generics.py --interface-cache-entries 2 --output out/interface-dispatch/baseline --target all --emsdk .emsdk ${{ matrix.protocol == 'lightweight' && '--lightweight-returns' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aot-feature-failures-${{ matrix.protocol }}
          path: |
            out/aot-features*/*.log
            out/global-generics/*/*.log
            out/interface-dispatch/baseline/*/*.log
            out/interface-dispatch/cached/*/*.log

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows x64 native, os: windows-2022, arch: x64, host: NATIVE}
          - {name: Windows x86 native, os: windows-2022, arch: Win32, host: NATIVE}
          - {name: Linux x64 native, os: ubuntu-24.04, arch: native, host: NATIVE}
          - {name: Linux ARM64 native, os: ubuntu-24.04-arm, arch: native, host: NATIVE}
          - {name: Windows x64 minimal, os: windows-2022, arch: x64, host: PORTABLE}
          - {name: Linux x64 minimal, os: ubuntu-24.04, arch: native, host: PORTABLE}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          args=()
          if [[ '${{ matrix.arch }}' != native ]]; then args+=(-A '${{ matrix.arch }}'); fi
          cmake -S src/tests/runtime-regressions -B out/ci -DCMAKE_BUILD_TYPE=Release -DLEANCLR_BCL_ADAPTER=MONO -DLEANCLR_HOST=${{ matrix.host }} "${args[@]}"
      - name: Build runtime and standalone regressions
        run: cmake --build out/ci --config Release --parallel 2 --target $NATIVE_TARGETS
      - name: Test on target architecture
        run: ctest --test-dir out/ci -C Release --output-on-failure -R "$NATIVE_TESTS"
      - name: Verify experimental return protocols (not performance thresholds)
        if: matrix.host == 'NATIVE' && matrix.arch != 'Win32'
        run: |
          args=()
          if [[ '${{ matrix.arch }}' != native ]]; then args+=(-A '${{ matrix.arch }}'); fi
          cmake -S src/benchmarks/result-abi -B out/protocols -DCMAKE_BUILD_TYPE=Release "${args[@]}"
          cmake --build out/protocols --config Release --parallel 2
          ctest --test-dir out/protocols -C Release --output-on-failure

  custom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S src/tests/runtime-regressions -B out/custom -DCMAKE_BUILD_TYPE=Release -DLEANCLR_HOST=CUSTOM -DLEANCLR_REGRESSION_PUBLIC_API_ONLY=ON
      - run: cmake --build out/custom --parallel 2
      - run: ctest --test-dir out/custom --output-on-failure

  wasm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: '4.0.12'
          path: .emsdk
      - name: Install pinned toolchain
        run: |
          .emsdk/emsdk install 4.0.12
          .emsdk/emsdk activate 4.0.12
      - name: Build and run wasm in Node
        shell: bash
        run: |
          source .emsdk/emsdk_env.sh
          emcmake cmake -S src/tests/runtime-regressions -B out/wasm -DCMAKE_BUILD_TYPE=Release -DLEANCLR_HOST=PORTABLE
          cmake --build out/wasm --parallel 2 --target $NATIVE_TARGETS
          ctest --test-dir out/wasm --output-on-failure -R "$NATIVE_TESTS"
          emcmake cmake -S src/benchmarks/result-abi -B out/protocols-wasm -DCMAKE_BUILD_TYPE=Release -DCMAKE_CROSSCOMPILING_EMULATOR=node
          cmake --build out/protocols-wasm --parallel 2
          ctest --test-dir out/protocols-wasm --output-on-failure

  sanitize-and-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure instrumented runtime
        run: cmake -S src/tests/runtime-regressions -B out/sanitize -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLEANCLR_SANITIZERS=address,undefined -DLEANCLR_BUILD_IL_FUZZER=ON
      - run: cmake --build out/sanitize --parallel 2 --target ${NATIVE_TARGETS/il-fuzz-smoke/} il-fuzz
      - run: ctest --test-dir out/sanitize --output-on-failure -R "$NATIVE_TESTS"
      - name: Fuzz malformed IL and exception ranges
        run: |
          mkdir -p out/fuzz-corpus out/fuzz-artifacts
          cp src/tests/runtime-regressions/fuzz-corpus/* out/fuzz-corpus/
          out/sanitize/il-fuzz out/fuzz-corpus -max_total_time=120 -max_len=4096 -timeout=5 -rss_limit_mb=2048 -artifact_prefix=out/fuzz-artifacts/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sanitizer-and-fuzz-failures
          path: |
            out/fuzz-artifacts/
            out/sanitize/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
