name: CI Test

on:
  # push:
  #   branches: [ "main", "master" ]
  # pull_request:
  #   branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Make scripts executable
        run: |
          chmod +x scripts/ci.sh
          chmod +x scripts/test/build-all.sh
          chmod +x scripts/test/run.sh
          chmod +x scripts/test/basic_test_runner/build.sh

      - name: Build and run tests
        run: ./scripts/ci.sh Release

      - name: Notify Feishu on failure
        if: failure()
        run: |
          MSG="{\"msg_type\":\"text\",\"content\":{\"text\":\"[CI] Automated test failed.\\nRepo: ${{ github.repository }}\\nCommit: ${{ github.sha }}\\nWorkflow: ${{ github.workflow }}\\nJob: ${{ github.job }}\\nPlease check and fix it.\"}}"
          curl -X POST -H "Content-Type: application/json" -d "$MSG" "${{ secrets.FEISHU_ROBOT_NOTIFY_URL }}"
